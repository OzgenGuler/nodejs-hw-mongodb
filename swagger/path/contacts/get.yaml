tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve all contacts belonging to the authenticated user with optional filtering and pagination.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Page number for pagination
  - name: perPage
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    description: Number of contacts per page
  - name: sortBy
    in: query
    schema:
      type: string
      enum: [name, email, contactType, isFavourite, createdAt, updatedAt]
      default: name
    description: Field to sort by
  - name: sortOrder
    in: query
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sort order
  - name: filter
    in: query
    schema:
      type: string
    description: Filter contacts by name or email
  - name: contactType
    in: query
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter by contact type
  - name: isFavourite
    in: query
    schema:
      type: boolean
    description: Filter by favourite status
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: array
              items:
                $ref: '../components/schemas/Contact.yaml'
  '401':
    $ref: '../components/responses/Unauthorized.yaml'
