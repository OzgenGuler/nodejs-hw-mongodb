tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update an existing contact. Only contacts belonging to the authenticated user can be updated.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
      format: objectid
    description: Unique identifier of the contact
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact's full name
          phoneNumber:
            type: string
            description: Contact's phone number
          email:
            type: string
            format: email
            description: Contact's email address
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
          isFavourite:
            type: boolean
            description: Mark as favourite
          photo:
            type: string
            format: binary
            description: Contact photo image file
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              $ref: '../../../components/schemas/Contact.yaml'
  '401':
    $ref: '../../../components/responses/Unauthorized.yaml'
  '404':
    $ref: '../../../components/responses/NotFound.yaml'
