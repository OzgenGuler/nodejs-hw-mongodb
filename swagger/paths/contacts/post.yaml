tags:
  - Contacts
summary: Create new contact
operationId: createContact
description: Create a new contact for the authenticated user. Supports optional photo upload.
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            type: string
            description: Contact's full name
            example: 'John Doe'
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '+1234567890'
          email:
            type: string
            format: email
            description: Contact's email address
            example: 'john.doe@example.com'
          contactType:
            type: string
            enum: [work, home, personal]
            default: personal
            description: Type of contact
          isFavourite:
            type: boolean
            default: false
            description: Mark as favourite
          photo:
            type: string
            format: binary
            description: Contact photo image file
responses:
  '201':
    description: Successfully created contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              $ref: '../../components/schemas/Contact.yaml'
  '400':
    $ref: '../../components/responses/ValidationError.yaml'
  '401':
    $ref: '../../components/responses/Unauthorized.yaml'
