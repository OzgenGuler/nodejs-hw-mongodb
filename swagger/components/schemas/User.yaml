type: object
required:
  - name
  - email
properties:
  _id:
    type: string
    format: objectid
    description: Unique identifier for the user
  name:
    type: string
    description: User's full name
    example: 'Jane Smith'
  email:
    type: string
    format: email
    description: User's email address
    example: 'jane@example.com'
  createdAt:
    type: string
    format: date-time
    description: User creation timestamp
  updatedAt:
    type: string
    format: date-time
    description: User last update timestamp
