openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts Management API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: >
    A comprehensive API for managing personal contacts with user authentication,
    password reset functionality, and image upload capabilities.

    Features:
    - User registration and authentication
    - JWT-based session management
    - Contact CRUD operations with user isolation
    - Image upload to Cloudinary
    - Password reset via email

tags:
  - name: Auth
    description: Authentication and user management
  - name: Contacts
    description: Contact management operations

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://hw7-swagger-viab.onrender.com
    description: Production server

paths:
  contacts:
    { contactId }:
      get:
        $ref: '../swagger/paths/contacts/{contactId}/get.yaml'
      patch:
        $ref: '../swagger/paths/contacts/{contactId}/patch.yaml'
      delete:
        $ref: '../swagger/paths/contacts/{contactId}/delete.yaml'
  get:
    $ref: '../swagger/paths/contacts/get.yaml'
  post:
    $ref: '../swagger/paths/contacts/post.yaml'
  auth/register:
    $ref: '../swagger/paths/auth/register.yaml'
  auth:
    login:
      $ref: '../swagger/paths/auth/login.yaml'
  # /auth/logout:
  #   $ref: '../swagger/paths/auth/logout.yaml'
  # /auth/refresh:
  #   $ref: '../swagger/paths/auth/refresh.yaml'
  # /auth/send-reset-email:
  #   $ref: '../swagger/paths/auth/send-reset-email.yaml'
  # /auth/reset-password:
  #   $ref: '../swagger/paths/auth/reset-password.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Contact:
      $ref: '../swagger/components/schemas/Contact.yaml'
    User:
      $ref: '../swagger/components/schemas/User.yaml'
    Error:
      $ref: '../swagger/components/schemas/Error.yaml'
    SuccessResponse:
      $ref: '../swagger/components/schemas/SuccessResponse.yaml'

  responses:
    NotFound:
      $ref: '../swagger/components/responses/NotFound.yaml'
    Unauthorized:
      $ref: '../swagger/components/responses/Unauthorized.yaml'
    ValidationError:
      $ref: '../swagger/components/responses/ValidationError.yaml'
